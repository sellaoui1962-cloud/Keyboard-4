name: Build APK from zip

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p /tmp/proj
          for z in *.zip; do unzip -q -o "$z" -d /tmp/proj; done
          S=$(find /tmp/proj -name settings.gradle | head -1)
          echo "DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" Kimikb-Keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KimikbKeyboard-apk
          path: Kimikb-Keyboard.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kimikb build ${{ github.run_number }}
          files: Kimikb-Keyboard.apk
